<div class="login-container d-flex align-items-center justify-content-center bg-gray-app">
  <div class="card login-card shadow border-0">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <i class="fas fa-microscope fa-3x text-primary mb-3"></i>
        <h4 class="fw-bold">Welcome Back</h4>
      </div>

      <!-- Tab Navigation (Hidden during active OTP entry) -->
      <ul *ngIf="!isOtpSent" class="nav nav-pills nav-justified mb-4" id="loginTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="otp-tab" data-bs-toggle="pill" data-bs-target="#otp-pane" type="button">
            <i class="fas fa-mobile-alt me-2"></i>OTP
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="user-tab" data-bs-toggle="pill" data-bs-target="#user-pane" type="button">
            <i class="fas fa-user-lock me-2"></i>User Login
          </button>
        </li>
      </ul>

      <!-- Tab Content Area -->
      <div class="tab-content" id="loginTabsContent">
        
        <!-- Mobile / Email OTP Main Tab -->
        <div class="tab-pane fade show active" id="otp-pane" role="tabpanel">
          <!-- FIX: Form now dynamically decides whether to request or verify based on isOtpSent state -->
          <form (submit)="isOtpSent ? onOtpLogin() : onOtpRequest(); $event.preventDefault()">
            
            <!-- STAGE 1A: Identifier Input Form -->
            <div *ngIf="!isOtpSent" class="mb-3">
              <label class="form-label text-secondary small fw-bold">Email Id</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                <input type="text" [(ngModel)]="loginData.identifier" name="otpIdentifier" class="form-control border-start-0 ps-0" placeholder="Enter your Mobile or Email id" autocomplete="off" required>
              </div>
            </div>

            <!-- STAGE 1B: Verify OTP Input Form (Appears after successful POST dispatch) -->
            <div *ngIf="isOtpSent" class="mb-3">
              <div class="text-center mb-2">
                <span class="badge bg-info text-dark p-2 border">Verification Code sent to: <strong>{{ loginData.identifier }}</strong></span>
              </div>
              <label class="form-label text-secondary small fw-bold">Enter Numeric OTP</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="fas fa-key text-muted"></i></span>
                <input type="text" [(ngModel)]="loginData.otp" name="otpCode" class="form-control border-start-0 ps-0" placeholder="000000" maxlength="6" autocomplete="one-time-code" required>
              </div>
            </div>

            <!-- Contextual Button UI changes state dynamically -->
            <button type="submit" [className]="isOtpSent ? 'btn btn-success w-100 py-2 fw-bold mt-2 shadow-sm' : 'btn btn-primary w-100 py-2 fw-bold mt-2 shadow-sm'">
              {{ isOtpSent ? 'Verify & Sign In' : 'Send OTP' }}
            </button>

            <!-- Reset Link option back to re-type phone or email identifier -->
            <div *ngIf="isOtpSent" class="text-center mt-3">
              <a href="javascript:void(0)" (click)="resetOtpState()" class="text-decoration-none small text-muted"><i class="fas fa-arrow-left me-1"></i> Edit Address / Number</a>
            </div>
          </form>
        </div>

        <!-- Username & Password Alternative Main Tab -->
        <div class="tab-pane fade" id="user-pane" role="tabpanel">
          <form (submit)="onUserLogin(); $event.preventDefault()">
            <div class="mb-3">
              <label class="form-label text-secondary small fw-bold">Username / Email</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-muted"></i></span>
                <input type="text" [(ngModel)]="loginData.identifier" name="passwordIdentifier" class="form-control border-start-0 ps-0" placeholder="Username or email" autocomplete="username" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label text-secondary small fw-bold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" [(ngModel)]="loginData.password" name="userPassword" class="form-control border-start-0 ps-0" placeholder="••••••••" autocomplete="current-password" required>
              </div>
            </div>
            <div class="d-flex justify-content-between mb-3 small">
              <div class="form-check">
                <input class="form-check-input me-1" type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="text-decoration-none">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Login with Password</button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
